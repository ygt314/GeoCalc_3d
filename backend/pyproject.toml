[project]
name = "geocalc-3d-backend"
version = "1.3.0"
description = "3D几何计算器 后端(学习项目,原型:着火的冰块nya 的 GeometryCalculator)"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.0",
    "sympy>=1.14.0",
    "qtpy>=2.4",
    # GUI 后端按平台条件安装:
    # - Windows: 用系统自带的 EdgeChromium(WebView2),零 Qt 依赖
    # - 其他(Linux/WSL2): PyQt5 + QtWebEngine(Chromium 87,需 polyfill)
    # 注意: Chromium 87 不支持 ES2022 API,前端 index.html 已加 polyfill
    "PyQt5==5.15.11; sys_platform != 'win32'",
    "PyQtWebEngine==5.15.7; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # 打包工具(装进项目 venv,pyinstaller 才能收集到 PyQt5)
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
# 让 pytest 能 import src 下的模块(把 src 加入 sys.path)
pythonpath = ["src"]
# 收集 backend/tests 和 src/data/tests 两个测试目录
testpaths = ["tests", "src/data/tests"]
# 测试文件命名:test_*.py
python_files = ["test_*.py"]
